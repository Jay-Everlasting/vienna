<style>
/* Layout idea: like a map app. Day tabs on top; map left (sticky), one-line stop list right.
   Rows expand on tap. Red = booked, gold = pick one, teal = do any. */
:root{
  --paper:#f3f4f6; --card:#ffffff; --ink:#1c2230; --muted:#5d6577; --line:#dde0e6;
  --wine:#9a2a3a; --gold:#a8781c; --teal:#2e6b6f;
  --mapbg:#e6e9ee; --water:#b7d1e5; --park:#d2e2cd; --road:#ffffff; --u1:#c93a3a;
  --display:"Bodoni Moda", Georgia, serif;
  --body:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#11141b; --card:#1a1f29; --ink:#e8eaf0; --muted:#9aa2b4; --line:#2b3240;
    --wine:#e07a88; --gold:#e0b45a; --teal:#6cbcb8;
    --mapbg:#192030; --water:#21405a; --park:#1e3325; --road:#3a4458; --u1:#ff6b6b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --paper:#11141b; --card:#1a1f29; --ink:#e8eaf0; --muted:#9aa2b4; --line:#2b3240;
  --wine:#e07a88; --gold:#e0b45a; --teal:#6cbcb8;
  --mapbg:#192030; --water:#21405a; --park:#1e3325; --road:#3a4458; --u1:#ff6b6b;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4}
a{color:inherit}
button{font:inherit;color:inherit}

/* top bar */
.top{position:sticky;top:0;z-index:10;background:var(--paper);border-bottom:1px solid var(--line)}
.topin{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{font-family:var(--display);font-size:22px;font-weight:700;margin-right:auto;white-space:nowrap}
.brand small{font-family:var(--body);font-size:13px;color:var(--muted);font-weight:600;margin-left:8px}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%}
.tabs button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer}

/* day layout */
main{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.day{display:none}
.day.on{display:block}
.dhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:0 0 12px}
.dhead h1{font-family:var(--display);font-size:26px;margin:0}
.dhead span{color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(340px,1fr);gap:16px;align-items:start}
.mapcol{position:sticky;top:64px}
.map{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--mapbg)}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:13px;color:var(--muted);align-items:center}
.gbtn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;text-decoration:none;background:var(--ink);color:var(--paper);border-radius:999px;padding:6px 14px}
.key{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}

/* list */
.list{list-style:none;margin:0;padding:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.list > li{border-top:1px solid var(--line)}
.list > li:first-child{border-top:0}
.move{display:flex;gap:10px;padding:8px 14px;font-size:14px;color:var(--muted);background:var(--paper)}
.row{width:100%;display:grid;grid-template-columns:52px 30px 1fr 18px;gap:8px;align-items:center;text-align:left;background:none;border:0;padding:12px 14px;cursor:pointer}
.row:hover{background:var(--paper)}
.row:focus-visible,.tabs button:focus-visible,.theme:focus-visible,.gbtn:focus-visible,.mbtn:focus-visible{outline:3px solid var(--gold);outline-offset:-3px}
.t{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}
.n{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;color:var(--card);font-weight:700;font-size:13px}
.k-booked .n{background:var(--wine)} .k-pick .n{background:var(--gold)} .k-free .n{background:var(--teal)} .k-backup .n{background:var(--muted)}
.ttl{min-width:0}
.ttl b{display:block;font-size:16px}
.k-booked .ttl b{color:var(--wine)}
.ttl .sub{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);transition:transform .2s}
li.open .chev{transform:rotate(90deg)}
li.hl{background:color-mix(in srgb, var(--gold) 10%, transparent)}
.det{display:none;padding:0 14px 12px 104px}
li.open .det{display:grid;gap:8px}
.opt{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:8px 10px;border-radius:10px;background:var(--paper)}
.opt .on{font-weight:700}
.opt .ln{flex:1 1 220px;font-size:14px;color:var(--muted)}
.mbtn{font-size:13px;font-weight:600;text-decoration:none;border:1px solid var(--ink);border-radius:999px;padding:3px 10px;white-space:nowrap}
.alpha{font-weight:700;color:var(--muted);font-size:13px}

/* map marks */
.pin{cursor:pointer}
.pin circle{stroke:var(--card);stroke-width:3}
.pin text{fill:var(--card);font:700 15px var(--body);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.pin .lab{fill:var(--ink);font:600 14px var(--body);text-anchor:start;paint-order:stroke;stroke:var(--mapbg);stroke-width:5px;stroke-linejoin:round}
.pin.hl circle{stroke:var(--ink);stroke-width:5}
.f-booked{fill:var(--wine)} .f-pick{fill:var(--gold)} .f-free{fill:var(--teal)} .f-backup{fill:var(--muted)} .f-home{fill:var(--ink)}
.maplab{fill:var(--muted);font:700 13px var(--body);letter-spacing:.14em;opacity:.7}
.u1lab{fill:var(--u1);font:600 12px var(--body);paint-order:stroke;stroke:var(--mapbg);stroke-width:4px}

.lmap{height:calc(100vh - 150px);min-height:420px;background:var(--mapbg)}
.mk{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;color:#fff;font:700 13px var(--body);border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.mk.wide{width:36px;border-radius:15px}
.mk.booked{background:var(--wine)} .mk.pick{background:var(--gold)} .mk.free{background:var(--teal)} .mk.backup{background:#6b7280} .mk.home{background:#1c2230}
.mk.hl{transform:scale(1.25);border-color:#1c2230}
.leaflet-tooltip.blab{font:600 13px var(--body);border-radius:8px;padding:2px 8px}
.leaflet-container{font-family:var(--body)}
@media (max-width:860px){ .lmap{height:58vh;min-height:320px} }
/* bookings */
.book{max-width:760px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 16px}
.book label{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer}
.book label:first-child{border-top:0}
.book input{width:20px;height:20px;accent-color:var(--wine);flex:none;margin-top:2px}
.book b{display:block}
.book span span{color:var(--muted);font-size:14px}
.book input:checked + span b{text-decoration:line-through;color:var(--muted)}
.note{color:var(--muted);font-size:14px;margin:12px 0 0;max-width:760px}

@media (max-width:860px){
  .top{position:static}
  .topin{flex-wrap:nowrap;flex-direction:column;align-items:stretch}
  .topin .navrow{display:flex;gap:6px}
  .tabs{flex:1}
  .grid{grid-template-columns:1fr}
  .mapcol{position:static}
  .det{padding-left:14px}
  .brand small{display:none}
}
@media (prefers-reduced-motion: reduce){ .chev{transition:none} }
</style>
</head>

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mapsUrl(k){ const p=P[k]; let u="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(p[4]?p[0]+", "+p[1]:p[2]+","+p[3]); if(p[4]) u+="&query_place_id="+p[4]; return u; }
function dayRouteUrl(d){
  const keys=["flat"]; d.rows.forEach(r=>{ if(r[0]!=="move" && r[3]!=="backup"){ const k=r[4][0][0]; if(keys[keys.length-1]!==k) keys.push(k);} });
  return "https://www.google.com/maps/dir/"+keys.slice(0,10).map(k=>encodeURIComponent(P[k][4]?P[k][0]+", "+P[k][1]:P[k][2]+","+P[k][3])).join("/");
}
function rowsOf(d){ let n=0; return d.rows.map(r=> r[0]==="move" ? {move:r[1]} : {n:++n, time:r[0], icon:r[1], title:r[2], kind:r[3], opts:r[4]}); }
const letters="abcdefg";

function pinsOf(d, rows){
  const pts=[]; const seen={};
  rows.forEach(r=>{ if(r.move) return; r.opts.forEach((o,i)=>{ const id=o[0]+"|"+r.n; if(seen[id]) return; seen[id]=1;
    pts.push({k:o[0],n:r.n,lab:r.opts.length>1?r.n+letters[i]:String(r.n),kind:r.kind,main:i===0}); }); });
  return pts;
}
function render(){
  const main=document.getElementById("main");
  let html="";
  DAYS.forEach(d=>{
    const rows=rowsOf(d);
    const list=rows.map(r=>{
      if(r.move) return `<li class="move">${esc(r.move)}</li>`;
      const names=r.opts.map(o=>P[o[0]][0]);
      const sub = r.kind==="booked"||r.opts.length===1 ? r.opts[0][1] : names.join(r.kind==="pick"?" · or ":" · ");
      const det=r.opts.map((o,i)=>`<div class="opt">${r.opts.length>1?`<span class="alpha">${r.n}${letters[i]}</span>`:""}<span class="on">${esc(P[o[0]][0])}</span><span class="ln">${esc(o[1])}</span><a class="mbtn" href="${mapsUrl(o[0])}" target="_blank" rel="noopener">Maps ↗</a></div>`).join("");
      return `<li class="k-${r.kind}" data-n="${r.n}"><button class="row" type="button" aria-expanded="false"><span class="t">${esc(r.time)}</span><span class="n">${r.n}</span><span class="ttl"><b>${esc(r.icon)} ${esc(r.title)}</b><span class="sub">${esc(sub)}</span></span><span class="chev" aria-hidden="true">›</span></button><div class="det">${det}</div></li>`;
    }).join("");
    html+=`<section class="day" id="${d.id}" role="tabpanel">
      <div class="dhead"><h1>${esc(d.title)}</h1><span>${esc(d.sub)}</span></div>
      <div class="grid">
        <div class="mapcol"><div class="map"><div class="lmap" id="map-${d.id}" role="region" aria-label="Map of ${esc(d.title)}"></div></div>
          <div class="mapbar"><a class="gbtn" href="${dayRouteUrl(d)}" target="_blank" rel="noopener">Open day in Google Maps ↗</a>
          <span class="key"><span class="dot" style="background:var(--wine)"></span>booked</span><span class="key"><span class="dot" style="background:var(--gold)"></span>pick one</span><span class="key"><span class="dot" style="background:var(--teal)"></span>do any</span></div></div>
        <ol class="list">${list}</ol>
      </div></section>`;
  });
  html+=`<section class="day" id="book" role="tabpanel"><div class="dhead"><h1>To book</h1><span>Tick items off as you go (saved in this browser)</span></div><div class="book">${BOOK.map(([id,a,b])=>`<label for="${id}"><input type="checkbox" id="${id}"><span><b>${esc(a)}</b><span>${esc(b)}</span></span></label>`).join("")}</div><p class="note">31 Dec and 1 Jan are holidays and many places shorten their hours, so call ahead for anything marked "call". The U-Bahn runs all night on New Year's Eve.</p></section>`;
  main.innerHTML=html;

  document.getElementById("tabs").innerHTML = DAYS.map(d=>`<button role="tab" data-id="${d.id}" type="button">${esc(d.tab)}</button>`).join("")+`<button role="tab" data-id="book" type="button">✓ To book</button>`;
}
render();

/* tabs via hash */
function show(id){
  if(!document.getElementById(id)) id="day-1";
  document.querySelectorAll(".day").forEach(s=>s.classList.toggle("on", s.id===id));
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.id===id)));
}
document.getElementById("tabs").addEventListener("click", e=>{ const b=e.target.closest("button"); if(!b) return; location.hash=b.dataset.id; show(b.dataset.id); });
window.addEventListener("hashchange", ()=>show(location.hash.slice(1)));
show(location.hash.slice(1)||"day-1");

/* rows <-> pins */
function highlight(sec,n,on){ sec.querySelectorAll(`.pin[data-n="${n}"]`).forEach(p=>p.classList.toggle("hl",on)); }
document.querySelectorAll(".day").forEach(sec=>{
  sec.querySelectorAll(".list > li[data-n]").forEach(li=>{
    const n=li.dataset.n, btn=li.querySelector(".row");
    btn.addEventListener("click", ()=>{ const o=!li.classList.contains("open"); li.classList.toggle("open",o); btn.setAttribute("aria-expanded",String(o)); });
    li.addEventListener("mouseenter", ()=>highlight(sec,n,true));
    li.addEventListener("mouseleave", ()=>highlight(sec,n,false));
  });
  sec.querySelectorAll(".pin[data-k]").forEach(p=>{
    const go=()=>{ const li=sec.querySelector(`.list > li[data-n="${p.dataset.n}"]`); if(!li) return;
      sec.querySelectorAll(".list > li.hl").forEach(x=>x.classList.remove("hl"));
      li.classList.add("open","hl"); li.querySelector(".row").setAttribute("aria-expanded","true");
      li.scrollIntoView({block:"nearest", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
      sec.querySelectorAll(".pin.hl").forEach(x=>x.classList.remove("hl")); highlight(sec,p.dataset.n,true); };
    p.addEventListener("click",go);
    p.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } });
  });
});


/* ---------- real maps (Leaflet + OpenStreetMap/CARTO tiles) ---------- */
const MAPS={}; const MK={};
const TILES={light:"https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", dark:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png"};
const ATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>';
function curTheme(){ return document.documentElement.getAttribute("data-theme")==="dark"?"dark":"light"; }
function initMap(d){
  if(MAPS[d.id] || typeof L==="undefined") return;
  const sec=document.getElementById(d.id);
  const map=L.map("map-"+d.id,{scrollWheelZoom:true,zoomControl:true});
  map._tiles=L.tileLayer(TILES[curTheme()],{attribution:ATTR,subdomains:"abcd",maxZoom:19}).addTo(map);
  const rows=rowsOf(d); const pins=pinsOf(d,rows); MK[d.id]={};
  /* route: first option of each row */
  const route=[[P.flat[2],P.flat[3]]].concat(pins.filter(p=>p.main&&p.kind!=="backup").map(p=>[P[p.k][2],P[p.k][3]]));
  L.polyline(route,{color:"#1c2230",weight:3,opacity:.5,dashArray:"2 9",lineCap:"round"}).addTo(map);
  L.marker([P.flat[2],P.flat[3]],{icon:L.divIcon({className:"",html:'<div class="mk home">⌂</div>',iconSize:[30,30],iconAnchor:[15,15]}),title:"The flat"}).addTo(map).bindPopup("<b>Davidgasse 51</b><br>The flat");
  pins.forEach(p=>{
    const html=`<div class="mk ${p.kind}${p.lab.length>2?" wide":""}">${p.lab}</div>`;
    const m=L.marker([P[p.k][2],P[p.k][3]],{icon:L.divIcon({className:"",html,iconSize:[30,30],iconAnchor:[15,15]}),title:p.lab+". "+P[p.k][0],zIndexOffset:p.kind==="booked"?500:0}).addTo(map);
    m.bindTooltip(p.lab+". "+P[p.k][0],{direction:"right",offset:[14,0],className:"blab",permanent:p.kind==="booked"});
    m.on("click",()=>openRow(sec,p.n));
    (MK[d.id][p.n] ||= []).push(m);
  });
  const fitPts=pins.filter(p=>d.id==="day-4"||P[p.k][2]>48.183).map(p=>[P[p.k][2],P[p.k][3]]);
  if(d.id==="day-4") fitPts.push([P.flat[2],P.flat[3]]);
  map.fitBounds(fitPts,{padding:[40,40]});
  MAPS[d.id]=map;
}
function mkHL(id,n,on){ (MK[id]&&MK[id][n]||[]).forEach(m=>{ const el=m.getElement(); if(el){ const c=el.querySelector(".mk"); if(c) c.classList.toggle("hl",on);} }); }
function openRow(sec,n){
  const li=sec.querySelector(`.list > li[data-n="${n}"]`); if(!li) return;
  sec.querySelectorAll(".list > li.hl").forEach(x=>x.classList.remove("hl"));
  li.classList.add("open","hl"); li.querySelector(".row").setAttribute("aria-expanded","true");
  li.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});
}
function activate(id){
  const d=DAYS.find(x=>x.id===id); if(!d) return;
  initMap(d); setTimeout(()=>MAPS[id]&&MAPS[id].invalidateSize(),60);
}
DAYS.forEach(d=>{
  const sec=document.getElementById(d.id);
  sec.querySelectorAll(".list > li[data-n]").forEach(li=>{
    const n=li.dataset.n;
    li.addEventListener("mouseenter",()=>mkHL(d.id,n,true));
    li.addEventListener("mouseleave",()=>mkHL(d.id,n,false));
    li.querySelector(".row").addEventListener("click",()=>{ const ms=MK[d.id]&&MK[d.id][n]; if(ms&&ms.length&&li.classList.contains("open")){ MAPS[d.id].fitBounds(L.latLngBounds(ms.map(m=>m.getLatLng())).pad(0.6),{maxZoom:16}); } });
  });
});
window.addEventListener("hashchange",()=>activate(location.hash.slice(1)||"day-1"));
document.getElementById("tabs").addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) activate(b.dataset.id); });
activate(location.hash.slice(1)||"day-1");

/* theme: light by default */
function setTheme(t){ document.documentElement.setAttribute("data-theme",t); document.getElementById("theme").textContent = t==="dark"?"☀️":"🌙"; try{localStorage.setItem("vienna-theme",t);}catch(e){} }
let th="light"; try{ th=localStorage.getItem("vienna-theme")||"light"; }catch(e){}
setTheme(th);
document.getElementById("theme").addEventListener("click",()=>{ setTheme(document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"); Object.values(MAPS).forEach(m=>m._tiles.setUrl(TILES[curTheme()])); });

/* bookings memory */
let saved={}; try{ saved=JSON.parse(localStorage.getItem("vienna-bookings")||"{}"); }catch(e){}
document.querySelectorAll(".book input").forEach(i=>{ i.checked=!!saved[i.id]; i.addEventListener("change",()=>{ saved[i.id]=i.checked; try{localStorage.setItem("vienna-bookings",JSON.stringify(saved));}catch(e){} }); });
</script>
